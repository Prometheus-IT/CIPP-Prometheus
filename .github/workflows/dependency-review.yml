# SCA: Fails PRs that introduce dependencies with known vulnerabilities
# ISO 27001:2022 A.8.28/8.29 evidence — Software Composition Analysis at merge time
name: Dependency Review
on:
  pull_request:
    branches: [main, dev]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.repository_owner == 'CyberDrain' || github.repository == 'Prometheus-IT/CIPP-Prometheus'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Block merge on known vulnerabilities of moderate severity or higher
          fail-on-severity: moderate
          # Read-only on fork PRs too; results are available in the job summary.
          comment-summary-in-pr: never
          # Optional: block copyleft-incompatible licenses (adjust for AGPL-3.0 project policy)
          # deny-licenses: GPL-1.0-only
